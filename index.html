*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#f8fafc,#ffffff);color:#0f172a;line-height:1.7}
a{color:#2563eb;text-decoration:none}
a:hover{color:#1d4ed8}
header{padding:90px 20px;text-align:center;background:radial-gradient(circle at top,#e0f2fe,#ffffff)}
header h1{font-size:3.2rem;font-weight:800}
header span{color:#2563eb}
header p{color:#475569;margin-top:10px;font-size:1.1rem}
header .btn{margin-top:15px}
.hamburger{position:fixed;top:20px;left:20px;display:flex;flex-direction:column;cursor:pointer;z-index:1000;transition:0.3s}
.hamburger div{width:28px;height:3px;background:#2563eb;margin:5px 0;transition:.4s}
.nav-menu{
  position:fixed;top:0;left:-260px;width:260px;height:100%;
  background:#fff;box-shadow:2px 0 12px rgba(0,0,0,.1);
  padding:80px 20px 20px 20px;display:flex;flex-direction:column;
  gap:25px;transition:.4s;z-index:999;
}
.nav-menu a{text-decoration:none;font-weight:600;color:#2563eb;font-size:1.1rem;transition:.3s}
.nav-menu a:hover{color:#1d4ed8}
.nav-menu .close-menu{position:absolute;top:15px;right:15px;font-size:22px;cursor:pointer;color:#2563eb}
main{max-width:1100px;margin:auto;padding:60px 20px}
section{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:30px;margin-bottom:40px;box-shadow:0 6px 15px rgba(0,0,0,.04)}
h2{margin-bottom:15px;font-size:1.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:linear-gradient(135deg,#eff6ff,#ffffff);border:1px solid #e5e7eb;border-radius:14px;padding:20px}
.token-box{font-family:monospace;word-break:break-all;background:#f1f5f9;padding:12px;border-radius:8px;display:inline-block}
.btn{display:inline-block;padding:12px 24px;background:#2563eb;color:#fff;border-radius:10px;text-decoration:none;font-weight:600;transition:.3s}
.btn:hover{background:#1d4ed8}
footer{text-align:center;padding:25px;font-size:14px;color:#64748b;border-top:1px solid #e5e7eb}
.social-icons{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin-top:20px}
.social-icons a{color:#2563eb;font-size:24px;width:50px;height:50px;display:flex;align-items:center;justify-content:center;background:#e0f2fe;border-radius:50%;transition:.3s}
.social-icons a:hover{background:#2563eb;color:#fff}
.about-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:25px;margin-top:25px}
.about-box{background:linear-gradient(135deg,#e0f7ff,#ffffff);border:1px solid #cce7f1;border-radius:15px;padding:20px;box-shadow:0 5px 15px rgba(0,0,0,0.05)}
.about-box h3{color:#0077cc;margin-bottom:10px;font-size:1.3rem}
.about-box p,.about-box ul{color:#0f172a;font-size:1rem;line-height:1.6}
.about-box ul li{margin-bottom:8px}
.tabs{display:flex;gap:10px;margin-bottom:15px}
.tab{padding:10px 20px;border:1px solid #2563eb;border-radius:8px;cursor:pointer;background:#eff6ff;color:#2563eb;font-weight:600;transition:.3s}
.tab.active{background:#2563eb;color:#fff}
@media(max-width:768px){header h1{font-size:2.2rem} main{padding:35px 15px}}
